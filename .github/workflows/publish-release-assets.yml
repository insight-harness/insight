name: Publish release assets

on:
  push:
    branches:
      - release-staging-v0.2.7

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staged LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.2.7 release-assets/*.zip --repo "$GITHUB_REPOSITORY" --clobber
